name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stokpintar_test
          POSTGRES_USER: stokpintar
          POSTGRES_PASSWORD: stokpintar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stokpintar -d stokpintar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stokpintar:stokpintar_test@localhost:5432/stokpintar_test?schema=public
      DATABASE_URL_TEST: postgresql://stokpintar:stokpintar_test@localhost:5432/stokpintar_test?schema=public
      JWT_SECRET: ci-only-secret-for-tests
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Generate Prisma Client
        working-directory: api
        run: npx prisma generate

      - name: Apply test database migrations
        working-directory: api
        run: npm run test:db:deploy

      - name: Run API tests
        working-directory: api
        run: npm test

      - name: Build API
        working-directory: api
        run: npm run build

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Lint web
        working-directory: web
        run: npm run lint

      - name: Build web
        working-directory: web
        run: npm run build
