services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stokpintar
      POSTGRES_USER: stokpintar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Atur POSTGRES_PASSWORD melalui file .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stokpintar -d stokpintar"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./api
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Atur DATABASE_URL melalui file .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Atur DATABASE_URL melalui file .env}
      JWT_SECRET: ${JWT_SECRET:?Atur JWT_SECRET melalui file .env}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: /api
        DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
